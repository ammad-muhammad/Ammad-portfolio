<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Crisp White Squircle with subtle border for light & dark tabs -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Left Bracket < -->
  <path d="M 18 22 L 10 32 L 18 42" fill="none" stroke="#111111" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Letter A -->
  <path d="M 23 43 L 32 19 L 41 43" fill="none" stroke="#111111" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="26.5" y1="35" x2="37.5" y2="35" stroke="#111111" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Right Bracket > -->
  <path d="M 46 22 L 54 32 L 46 42" fill="none" stroke="#111111" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>